group=dev.kolektiv.keel
version=0.0.2-SNAPSHOT.1

org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.vfs.watch=false
kotlin.code.style=official

# Publishing — override from CI / ~/.gradle/gradle.properties
keel.displayName=Keel
keel.description=Host-owned routing and swappable frontend packs for Kotlin servers.
keel.url=https://github.com/kolektivdev/keel
keel.scm=scm:git:https://github.com/kolektivdev/keel.git
keel.licenseName=Apache-2.0
keel.licenseUrl=https://www.apache.org/licenses/LICENSE-2.0.txt

# Optional credentials (never commit real values). Same Nexus login for
# keel-maven, maven-releases / maven-snapshots, and hosted keel-npm.
# Prefer env in CI: YURI_CAPITAL_REPO_USERNAME /
# YURI_CAPITAL_REPO_PASSWORD (GitHub Actions secrets of the same name).
# Local Maven: these two properties in ~/.gradle/gradle.properties.
# Local npm: those env vars, or ~/.npmrc _auth for keel-npm (see AGENTS.md).
# keel.publishing.yuriCapitalRepoUsername=
# keel.publishing.yuriCapitalRepoPassword=
# signing.keyId=
# signing.password=
# signing.secretKeyRingFile=
